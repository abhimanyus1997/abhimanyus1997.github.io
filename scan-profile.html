<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Identity Scan</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    :root {
      --bg: #050805;
      --panel: rgba(8, 20, 12, 0.9);
      --green: #a6ff2f;
      --green-soft: rgba(166, 255, 47, 0.45);
      --green-faint: rgba(166, 255, 47, 0.12);
      --white: #f5ffe8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(80, 160, 40, 0.14), transparent 35%),
        radial-gradient(circle at 20% 80%, rgba(166, 255, 47, 0.07), transparent 30%),
        #030603;
      font-family: "Courier New", monospace;
      overflow: hidden;
      color: var(--green);
    }

    .scene {
      position: relative;
      width: min(300px, 92vw);
      aspect-ratio: 3 / 4;
      perspective: 900px;
      z-index: 10;
    }

    .scan-card {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid rgba(166, 255, 47, 0.28);
      clip-path: polygon(
        7% 0,
        93% 0,
        100% 7%,
        100% 93%,
        93% 100%,
        7% 100%,
        0 93%,
        0 7%
      );
      box-shadow:
        0 0 50px rgba(166, 255, 47, 0.14),
        0 0 110px rgba(166, 255, 47, 0.08),
        inset 0 0 60px rgba(166, 255, 47, 0.08);
      transform-style: preserve-3d;
      animation: cardFloat 6s ease-in-out infinite;
    }

    .scan-card.active {
      animation:
        cardFloat 6s ease-in-out infinite,
        bootPulse 1.2s ease-out 1;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: contrast(1.08) saturate(0.92) brightness(0.76);
      transform: scale(1.015);
    }

    .scan-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background:
        linear-gradient(
          rgba(166, 255, 47, 0.045) 50%,
          rgba(0, 0, 0, 0.14) 50%
        );
      background-size: 100% 4px;
      mix-blend-mode: screen;
      animation: scanlines 0.6s linear infinite;
    }

    .scan-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 42%, rgba(0, 0, 0, 0.68) 100%),
        linear-gradient(90deg, rgba(166, 255, 47, 0.08), transparent 18%, transparent 82%, rgba(166, 255, 47, 0.08));
    }

    .noise {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      opacity: 0.12;
      background-image:
        repeating-radial-gradient(circle at 20% 30%, rgba(255,255,255,0.22) 0 1px, transparent 1px 3px);
      mix-blend-mode: overlay;
      animation: noiseShift 0.25s infinite steps(2);
    }

    .hud-border {
      position: absolute;
      inset: 18px;
      z-index: 11;
      pointer-events: none;
      border: 1px solid rgba(166, 255, 47, 0.62);
      clip-path: polygon(
        9% 0,
        91% 0,
        100% 9%,
        100% 91%,
        91% 100%,
        9% 100%,
        0 91%,
        0 9%
      );
      box-shadow:
        0 0 16px rgba(166, 255, 47, 0.45),
        inset 0 0 20px rgba(166, 255, 47, 0.12);
    }

    .corner {
      position: absolute;
      z-index: 12;
      width: 46px;
      height: 46px;
      border-color: var(--green);
      border-style: solid;
      filter: drop-shadow(0 0 8px var(--green));
      opacity: 0.95;
    }

    .c1 {
      top: 18px;
      left: 18px;
      border-width: 2px 0 0 2px;
    }

    .c2 {
      top: 18px;
      right: 18px;
      border-width: 2px 2px 0 0;
    }

    .c3 {
      bottom: 18px;
      left: 18px;
      border-width: 0 0 2px 2px;
    }

    .c4 {
      bottom: 18px;
      right: 18px;
      border-width: 0 2px 2px 0;
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(166, 255, 47, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(166, 255, 47, 0.055) 1px, transparent 1px);
      background-size: 30px 30px;
      mask-image: radial-gradient(circle, black 20%, transparent 78%);
      animation: gridDrift 8s linear infinite;
    }

    .scan-line {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 3px;
      top: -10%;
      z-index: 18;
      background: linear-gradient(
        90deg,
        transparent,
        var(--green),
        #efffa4,
        var(--green),
        transparent
      );
      box-shadow:
        0 0 16px var(--green),
        0 0 34px rgba(166, 255, 47, 0.9);
      animation: scanMove 3.15s cubic-bezier(.55,.02,.35,1) infinite;
    }

    .scan-glow {
      position: absolute;
      left: 0;
      right: 0;
      height: 150px;
      top: -25%;
      z-index: 17;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(166, 255, 47, 0.2),
        rgba(166, 255, 47, 0.06),
        transparent
      );
      animation: scanGlowMove 3.15s cubic-bezier(.55,.02,.35,1) infinite;
      mix-blend-mode: screen;
    }

    .face-box {
      position: absolute;
      width: 56%;
      height: 47%;
      left: 50%;
      top: 43%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
      border: 1px solid rgba(166, 255, 47, 0.22);
      box-shadow: 0 0 10px rgba(166, 255, 47, 0.18);
      animation: lockBreath 1.8s ease-in-out infinite;
    }

    .face-box::before,
    .face-box::after {
      content: "";
      position: absolute;
      inset: 15%;
      border: 1px dashed rgba(166, 255, 47, 0.3);
      border-radius: 50%;
      animation: reticleSpin 7s linear infinite;
    }

    .face-box::after {
      inset: 27%;
      animation-direction: reverse;
      opacity: 0.75;
    }

    .face-box span {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: var(--green);
      border-style: solid;
      filter: drop-shadow(0 0 8px var(--green));
    }

    .face-box span:nth-child(1) {
      top: -3px;
      left: -3px;
      border-width: 2px 0 0 2px;
    }

    .face-box span:nth-child(2) {
      top: -3px;
      right: -3px;
      border-width: 2px 2px 0 0;
    }

    .face-box span:nth-child(3) {
      bottom: -3px;
      left: -3px;
      border-width: 0 0 2px 2px;
    }

    .face-box span:nth-child(4) {
      bottom: -3px;
      right: -3px;
      border-width: 0 2px 2px 0;
    }

    .hud-text {
      position: absolute;
      z-index: 24;
      color: var(--green);
      font-size: 10px;
      letter-spacing: 1.7px;
      text-shadow: 0 0 9px rgba(166, 255, 47, 0.95);
      opacity: 0.95;
      pointer-events: none;
      white-space: nowrap;
    }

    .top-left {
      top: 34px;
      left: 38px;
    }

    .top-right {
      top: 34px;
      right: 38px;
    }

    .bottom-left {
      bottom: 38px;
      left: 38px;
      max-width: 72%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bottom-right {
      bottom: 38px;
      right: 38px;
      color: var(--white);
      opacity: 0;
      animation: verifiedFlash 3.15s ease-in-out infinite;
    }

    .panel {
      position: absolute;
      z-index: 13;
      border: 1px solid rgba(166, 255, 47, 0.22);
      background: rgba(20, 80, 32, 0.12);
      box-shadow:
        inset 0 0 18px rgba(166, 255, 47, 0.08),
        0 0 18px rgba(166, 255, 47, 0.08);
      pointer-events: none;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 12px;
      height: 1px;
      background: rgba(166, 255, 47, 0.7);
      box-shadow:
        0 10px rgba(166, 255, 47, 0.5),
        0 20px rgba(166, 255, 47, 0.35),
        0 30px rgba(166, 255, 47, 0.28),
        0 40px rgba(166, 255, 47, 0.2),
        0 50px rgba(166, 255, 47, 0.14);
      animation: panelCode 1.6s linear infinite;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(166, 255, 47, 0.16), transparent);
      transform: translateX(-120%);
      animation: panelSweep 3.2s ease-in-out infinite;
    }

    .panel-left {
      width: 125px;
      height: 95px;
      top: 92px;
      left: 36px;
      transform: perspective(320px) rotateY(20deg) rotateZ(-1deg);
    }

    .panel-right {
      width: 105px;
      height: 125px;
      top: 170px;
      right: 33px;
      transform: perspective(320px) rotateY(-20deg) rotateZ(1deg);
    }

    .panel-bottom {
      width: 150px;
      height: 70px;
      left: 36px;
      bottom: 88px;
      opacity: 0.75;
      transform: perspective(320px) rotateY(15deg);
    }

    .progress-wrap {
      position: absolute;
      left: 38px;
      right: 38px;
      bottom: 63px;
      height: 6px;
      z-index: 23;
      background: rgba(166, 255, 47, 0.13);
      box-shadow: inset 0 0 8px rgba(166, 255, 47, 0.18);
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), #efffa4);
      box-shadow: 0 0 14px var(--green);
      animation: progressFill 6s ease-in-out infinite;
    }

    .particles {
      position: absolute;
      inset: 0;
      z-index: 21;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      border-radius: 50%;
      opacity: 0;
      animation: particleFloat 3.5s ease-in-out infinite;
    }

    .particle:nth-child(1) { left: 18%; top: 30%; animation-delay: 0.1s; }
    .particle:nth-child(2) { left: 78%; top: 36%; animation-delay: 0.5s; }
    .particle:nth-child(3) { left: 22%; top: 70%; animation-delay: 1s; }
    .particle:nth-child(4) { left: 68%; top: 76%; animation-delay: 1.4s; }
    .particle:nth-child(5) { left: 46%; top: 20%; animation-delay: 1.8s; }
    .particle:nth-child(6) { left: 86%; top: 58%; animation-delay: 2.2s; }

    .start-overlay {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(166, 255, 47, 0.14), rgba(0, 0, 0, 0.9) 62%);
      cursor: pointer;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .start-button {
      color: var(--green);
      border: 1px solid rgba(166, 255, 47, 0.55);
      padding: 14px 18px;
      letter-spacing: 2px;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.45);
      box-shadow:
        0 0 18px rgba(166, 255, 47, 0.25),
        inset 0 0 14px rgba(166, 255, 47, 0.08);
      text-shadow: 0 0 8px var(--green);
      animation: startPulse 1.6s ease-in-out infinite;
    }

    .glitch {
      animation: glitchKick 5.4s infinite;
    }

    @keyframes cardFloat {
      0%, 100% {
        transform: rotateX(0deg) rotateY(0deg) translateY(0);
      }

      50% {
        transform: rotateX(1.5deg) rotateY(-1.2deg) translateY(-7px);
      }
    }

    @keyframes bootPulse {
      from {
        filter: brightness(1.8);
        transform: scale(1.025);
      }

      to {
        filter: brightness(1);
        transform: scale(1);
      }
    }

    @keyframes scanlines {
      from {
        background-position-y: 0;
      }

      to {
        background-position-y: 8px;
      }
    }

    @keyframes noiseShift {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(-2%, 2%);
      }
    }

    @keyframes gridDrift {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 30px 60px;
      }
    }

    @keyframes scanMove {
      0% {
        top: -8%;
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        top: 108%;
        opacity: 0;
      }
    }

    @keyframes scanGlowMove {
      0% {
        top: -26%;
        opacity: 0;
      }

      9% {
        opacity: 1;
      }

      100% {
        top: 106%;
        opacity: 0;
      }
    }

    @keyframes lockBreath {
      0%, 100% {
        box-shadow: 0 0 10px rgba(166, 255, 47, 0.2);
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        box-shadow: 0 0 34px rgba(166, 255, 47, 0.65);
        transform: translate(-50%, -50%) scale(1.025);
      }
    }

    @keyframes reticleSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes verifiedFlash {
      0%, 72% {
        opacity: 0;
      }

      82%, 100% {
        opacity: 1;
      }
    }

    @keyframes panelCode {
      0% {
        transform: translateY(-14px);
        opacity: 0.4;
      }

      100% {
        transform: translateY(18px);
        opacity: 0.9;
      }
    }

    @keyframes panelSweep {
      0%, 50% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(120%);
      }
    }

    @keyframes progressFill {
      0% { width: 0%; }
      38% { width: 44%; }
      65% { width: 74%; }
      86% { width: 100%; }
      100% { width: 100%; }
    }

    @keyframes particleFloat {
      0%, 100% {
        opacity: 0;
        transform: translateY(16px) scale(0.6);
      }

      45% {
        opacity: 1;
        transform: translateY(-18px) scale(1.2);
      }
    }

    @keyframes startPulse {
      0%, 100% {
        opacity: 0.75;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    @keyframes glitchKick {
      0%, 92%, 100% {
        transform: translate(0, 0);
        filter: none;
      }

      93% {
        transform: translate(2px, -1px);
        filter: hue-rotate(12deg) contrast(1.2);
      }

      94% {
        transform: translate(-2px, 1px);
      }

      95% {
        transform: translate(1px, 0);
        filter: none;
      }
    }

    @media (max-width: 480px) {
      .hud-text {
        font-size: 8px;
      }

      .panel-left,
      .panel-right,
      .panel-bottom {
        opacity: 0.5;
      }
    }

    #scanVideo,
    #scanCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      pointer-events: none;
    }

    #scanVideo {
      filter: contrast(1.08) saturate(0.92) brightness(0.76);
      transform: scaleX(-1) scale(1.015);
    }

    #scanCanvas {
      z-index: 10;
    }

    .error-hud {
      color: #ff7979 !important;
      text-shadow: 0 0 8px rgba(255, 120, 120, 0.8) !important;
    }
  </style>
</head>

<body>
  <div class="scene">
    <div class="scan-card" id="scanCard">
      <img src="static/images/cyber_profile.png" alt="Profile" class="profile-img glitch" />
      <video id="scanVideo" autoplay muted playsinline></video>
      <canvas id="scanCanvas"></canvas>

      <div class="grid"></div>
      <div class="noise"></div>
      <div class="hud-border"></div>

      <div class="corner c1"></div>
      <div class="corner c2"></div>
      <div class="corner c3"></div>
      <div class="corner c4"></div>

      <div class="panel panel-left"></div>
      <div class="panel panel-right"></div>
      <div class="panel panel-bottom"></div>

      <div class="scan-line"></div>
      <div class="scan-glow"></div>

      <div class="face-box">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="particles">
        <i class="particle"></i>
        <i class="particle"></i>
        <i class="particle"></i>
        <i class="particle"></i>
        <i class="particle"></i>
        <i class="particle"></i>
      </div>

      <div class="hud-text top-left">USER_ID: ABHIMANYUS1997</div>
      <div class="hud-text top-right">NEURAL_FACE_SCAN</div>
      <div class="hud-text bottom-left" id="scanStatus">SYSTEM STANDBY...</div>
      <div class="hud-text bottom-right" id="verifiedText">IDENTIFIED: ABHIMANYU SINGH</div>

      <div class="progress-wrap">
        <div class="progress"></div>
      </div>

      <div class="start-overlay" id="startOverlay">
        <div class="start-button">INITIALIZE SCAN + SOUND</div>
      </div>
    </div>
  </div>
<script>
    const overlay = document.getElementById("startOverlay");
    const statusText = document.getElementById("scanStatus");
    const scanCard = document.getElementById("scanCard");

    const states = [
      "SCANNING FACIAL GEOMETRY...",
      "MAPPING EYE LANDMARKS...",
      "ANALYZING BEARD SIGNATURE...",
      "MATCHING NEURAL PATTERN...",
      "CONFIDENCE: 99.7%",
      "IDENTIFIED AS ABHIMANYU"
    ];

    const staticLandmarks = [
      // Jaw (0-10)
      {x: 45, y: 110}, {x: 48, y: 130}, {x: 54, y: 150}, {x: 64, y: 170}, {x: 78, y: 185},
      {x: 90, y: 190}, {x: 102, y: 185}, {x: 116, y: 170}, {x: 126, y: 150}, {x: 132, y: 130},
      {x: 135, y: 110},
      // Nose bridge (11-14)
      {x: 90, y: 95}, {x: 90, y: 110}, {x: 90, y: 125}, {x: 90, y: 138},
      // Nose base (15-19)
      {x: 78, y: 138}, {x: 84, y: 142}, {x: 90, y: 144}, {x: 96, y: 142}, {x: 102, y: 138},
      // Left eye (20-25)
      {x: 66, y: 105}, {x: 72, y: 98}, {x: 78, y: 98}, {x: 84, y: 105}, {x: 78, y: 109}, {x: 72, y: 109},
      // Right eye (26-31)
      {x: 96, y: 105}, {x: 102, y: 98}, {x: 108, y: 98}, {x: 114, y: 105}, {x: 108, y: 109}, {x: 102, y: 109},
      // Lips outer (32-39)
      {x: 72, y: 160}, {x: 80, y: 155}, {x: 90, y: 153}, {x: 100, y: 155}, {x: 108, y: 160},
      {x: 100, y: 168}, {x: 90, y: 170}, {x: 80, y: 168}
    ];

    const MODEL_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";
    const REFERENCE_IMAGE = "abhimanyu-reference.jpg";
    const MATCH_THRESHOLD = 0.52;

    let faceMatcher = null;
    let audioContext;
    let masterGain;
    let scanLoopTimer;
    let statusTimer;
    
    let scanState = "searching"; // "searching", "scanning", "verified", "unknown"
    let scanProgress = 0;
    let scanStartTime = 0;
    let targetLockedTime = 0;
    
    let lastSpokenTime = 0;
    let lastSpokenIdentity = ""; // "ABHIMANYU", "UNKNOWN", "MULTIPLE"

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function createAudio() {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioContext.createGain();
        masterGain.gain.value = 0.12;
        masterGain.connect(audioContext.destination);
      } catch (e) {
        console.warn("Could not initialize audio context:", e);
      }
    }

    function tone(freq, duration, type = "sine", gain = 0.12, delay = 0) {
      if (!audioContext || audioContext.state === "suspended") return;
      try {
        const now = audioContext.currentTime + delay;
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(freq, now);

        gainNode.gain.setValueAtTime(0.0001, now);
        gainNode.gain.exponentialRampToValueAtTime(gain, now + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        oscillator.connect(gainNode);
        gainNode.connect(masterGain);

        oscillator.start(now);
        oscillator.stop(now + duration + 0.03);
      } catch (e) {
        console.warn("Tone play failed:", e);
      }
    }

    function sweep(startFreq, endFreq, duration, gain = 0.08) {
      if (!audioContext || audioContext.state === "suspended") return;
      try {
        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.type = "sawtooth";
        oscillator.frequency.setValueAtTime(startFreq, now);
        oscillator.frequency.exponentialRampToValueAtTime(endFreq, now + duration);

        gainNode.gain.setValueAtTime(0.0001, now);
        gainNode.gain.exponentialRampToValueAtTime(gain, now + 0.04);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        oscillator.connect(gainNode);
        gainNode.connect(masterGain);

        oscillator.start(now);
        oscillator.stop(now + duration + 0.05);
      } catch (e) {
        console.warn("Sweep play failed:", e);
      }
    }

    function noiseBurst(duration = 0.12, gain = 0.045) {
      if (!audioContext || audioContext.state === "suspended") return;
      try {
        const bufferSize = audioContext.sampleRate * duration;
        const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
        }

        const source = audioContext.createBufferSource();
        const gainNode = audioContext.createGain();
        const filter = audioContext.createBiquadFilter();

        filter.type = "highpass";
        filter.frequency.value = 1200;

        gainNode.gain.value = gain;

        source.buffer = buffer;
        source.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(masterGain);

        source.start();
      } catch (e) {
        console.warn("Noise burst play failed:", e);
      }
    }

    function bootSound() {
      tone(180, 0.12, "sine", 0.09, 0);
      tone(360, 0.1, "triangle", 0.09, 0.11);
      tone(720, 0.12, "triangle", 0.08, 0.22);
      noiseBurst(0.14, 0.035);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          const voices = window.speechSynthesis.getVoices();
          const voice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) || 
                        voices.find(v => v.lang.startsWith('en'));
          if (voice) {
            utterance.voice = voice;
          }
          utterance.rate = 0.95;
          utterance.pitch = 0.9;
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          console.warn("TTS failed:", e);
        }
      }
    }

    function scanSound() {
      sweep(220, 980, 0.6, 0.035);
      tone(1200, 0.04, "square", 0.035, 0.12);
      tone(1600, 0.04, "square", 0.03, 0.32);
    }

    function verifiedSound() {
      tone(523.25, 0.11, "triangle", 0.08, 0);
      tone(659.25, 0.11, "triangle", 0.08, 0.1);
      tone(783.99, 0.18, "triangle", 0.09, 0.2);
      tone(1046.5, 0.24, "sine", 0.075, 0.34);
    }

    function triggerWelcomeSpeech(label, gender, count) {
      const now = Date.now();
      if (now - lastSpokenTime < 15000) return;

      let text = "";

      if (count > 1) {
        if (lastSpokenIdentity === "MULTIPLE" && now - lastSpokenTime < 30000) return;
        const options = [
          "I can see a lot of people around you, but I want to focus on you.",
          "Multiple subjects detected. Locking coordinate focus on the primary pilot.",
          "Crowded environment detected. Isolating main neural profile link."
        ];
        text = options[Math.floor(Math.random() * options.length)];
        lastSpokenIdentity = "MULTIPLE";
      } else if (label === "ABHIMANYU") {
        if (lastSpokenIdentity === "ABHIMANYU") return;
        const options = [
          "Access granted. Welcome back, pilot Abhimanyu. Systems initialized.",
          "Welcome back, Abhimanyu. The neural core is fully operational.",
          "Authentication successful. Good to see you, Abhimanyu.",
          "Neural link synchronized. Welcome back, commander Abhimanyu."
        ];
        text = options[Math.floor(Math.random() * options.length)];
        lastSpokenIdentity = "ABHIMANYU";
      } else {
        if (lastSpokenIdentity === "UNKNOWN") return;
        const title = gender === "male" ? "sir" : (gender === "female" ? "madam" : "guest");
        const options = [
          `You are not Abhimanyu. But happy to welcome you, ${title}.`,
          `Intruder alert. Just kidding. Welcome, ${title}.`,
          `Access restricted to pilot. Welcome anyway, ${title}.`,
          `Identity mismatch. But you are welcome here, ${title}.`
        ];
        text = options[Math.floor(Math.random() * options.length)];
        lastSpokenIdentity = "UNKNOWN";
      }

      if (text) {
        lastSpokenTime = now;
        speak(text);
      }
    }

    function startStatusCycle() {
      let index = 0;
      statusText.textContent = states[index];
      clearInterval(statusTimer);
      statusTimer = setInterval(() => {
        index = (index + 1) % states.length;
        statusText.textContent = states[index];

        if (index === states.length - 1) {
          verifiedSound();
          document.getElementById("verifiedText").style.opacity = 1;
        } else {
          tone(980 + index * 70, 0.045, "square", 0.025);
        }
      }, 1050);
    }

    function startScanLoop() {
      clearInterval(scanLoopTimer);
      scanSound();
      scanLoopTimer = setInterval(() => {
        scanSound();
        noiseBurst(0.08, 0.018);
      }, 3150);
    }

    async function loadModels() {
      const progressEl = document.querySelector('.progress');
      progressEl.style.animation = 'none';
      progressEl.style.width = '0%';

      const steps = [
        { name: "TinyFaceDetector", load: () => faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL), pct: 15 },
        { name: "FaceLandmarks68", load: () => faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL), pct: 35 },
        { name: "FaceRecognition", load: () => faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL), pct: 55 },
        { name: "FaceExpression", load: () => faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL), pct: 70 },
        { name: "AgeGenderNet", load: () => faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL), pct: 85 }
      ];

      for (const step of steps) {
        statusText.textContent = `LOADING ${step.name.toUpperCase()}...`;
        await step.load();
        progressEl.style.width = `${step.pct}%`;
        tone(600 + step.pct * 4, 0.05, "sine", 0.02);
      }

      statusText.textContent = `LOADING REFERENCE IMAGE...`;
      try {
        const img = await faceapi.fetchImage(REFERENCE_IMAGE);
        const referenceDetection = await faceapi
          .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({
            inputSize: 416,
            scoreThreshold: 0.5
          }))
          .withFaceLandmarks()
          .withFaceDescriptor();

        if (referenceDetection) {
          const labeledDescriptor = new faceapi.LabeledFaceDescriptors("ABHIMANYU", [
            referenceDetection.descriptor
          ]);
          faceMatcher = new faceapi.FaceMatcher(labeledDescriptor, MATCH_THRESHOLD);
          statusText.textContent = `REFERENCE LOADED`;
        } else {
          statusText.textContent = `REFERENCE FACE NOT FOUND`;
        }
      } catch (error) {
        console.warn("Reference load failed:", error);
        statusText.textContent = `REFERENCE IMAGE MISSING`;
      }

      progressEl.style.width = '100%';
      await sleep(300);
    }

    async function startWebcam() {
      const video = document.getElementById("scanVideo");
      const isMobile = window.matchMedia("(max-width: 768px)").matches;

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: isMobile ? 480 : 640 },
          height: { ideal: isMobile ? 640 : 480 }
        },
        audio: false
      });

      video.srcObject = stream;
      await new Promise((resolve) => {
        video.onloadedmetadata = resolve;
      });
      await video.play();

      const profileImg = document.querySelector('.profile-img');
      profileImg.style.display = 'none';
      video.style.display = 'block';
      document.getElementById("scanCanvas").style.display = 'block';
    }

    function resizeCanvas() {
      const canvas = document.getElementById("scanCanvas");
      const video = document.getElementById("scanVideo");
      const rect = video.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }

    function drawCyberBox(ctx, box, label, confidence, expression, age, gender, canvasWidth) {
      const x = canvasWidth - box.x - box.width;
      const y = box.y;
      const w = box.width;
      const h = box.height;

      const isKnown = label === "ABHIMANYU";
      const color = isKnown ? "#a6ff2f" : "#ffcc33";

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      ctx.restore();
    }

    function drawLandmarks(ctx, landmarks, canvasWidth) {
      const positions = landmarks.positions;
      ctx.save();
      ctx.fillStyle = "#38ff7a";
      for (const point of positions) {
        ctx.beginPath();
        ctx.arc(canvasWidth - point.x, point.y, 1.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    async function detectLoop() {
      const video = document.getElementById("scanVideo");
      const canvas = document.getElementById("scanCanvas");
      const ctx = canvas.getContext("2d");
      const progressEl = document.querySelector('.progress');

      if (video.paused || video.ended) {
        requestAnimationFrame(detectLoop);
        return;
      }

      resizeCanvas();

      const options = new faceapi.TinyFaceDetectorOptions({
        inputSize: 224,
        scoreThreshold: 0.5
      });

      try {
        const detections = await faceapi
          .detectAllFaces(video, options)
          .withFaceLandmarks()
          .withFaceExpressions()
          .withAgeAndGender()
          .withFaceDescriptors();

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const resized = faceapi.resizeResults(detections, { width: canvas.width, height: canvas.height });

        if (resized.length === 0) {
          if (scanState !== "searching" && Date.now() - targetLockedTime > 2000) {
            scanState = "searching";
            scanProgress = 0;
            progressEl.style.width = '0%';
            statusText.textContent = "SEARCHING FOR SUBJECT...";
            statusText.classList.remove('error-hud');
            document.getElementById("verifiedText").style.opacity = 0;
          }
        } else {
          const result = resized[0];
          let label = "UNKNOWN";
          if (faceMatcher) {
            const bestMatch = faceMatcher.findBestMatch(result.descriptor);
            if (bestMatch.label === "ABHIMANYU" && bestMatch.distance <= MATCH_THRESHOLD) {
              label = "ABHIMANYU";
            }
          }

          if (scanState === "searching") {
            scanState = "scanning";
            scanStartTime = Date.now();
            bootSound();
          }

          if (scanState === "scanning") {
            const elapsed = Date.now() - scanStartTime;
            scanProgress = Math.min(100, Math.floor((elapsed / 3000) * 100));
            progressEl.style.width = `${scanProgress}%`;

            const scanPhase = Math.floor(elapsed / 750);
            if (scanPhase === 0) statusText.textContent = "SCANNING FACIAL GEOMETRY...";
            else if (scanPhase === 1) statusText.textContent = "MAPPING EYE LANDMARKS...";
            else if (scanPhase === 2) statusText.textContent = "ANALYZING BEARD SIGNATURE...";
            else if (scanPhase === 3) statusText.textContent = "MATCHING NEURAL PATTERN...";

            if (scanProgress >= 100) {
              if (label === "ABHIMANYU") {
                scanState = "verified";
                statusText.textContent = "CONFIDENCE: 99.7%";
                statusText.classList.remove('error-hud');
                document.getElementById("verifiedText").textContent = "IDENTIFIED: ABHIMANYU";
                document.getElementById("verifiedText").style.opacity = 1;
                verifiedSound();
                triggerWelcomeSpeech("ABHIMANYU", result.gender, resized.length);
              } else {
                scanState = "unknown";
                statusText.textContent = "IDENTITY UNKNOWN";
                statusText.classList.add('error-hud');
                document.getElementById("verifiedText").textContent = "IDENTIFIED: UNKNOWN SUBJECT";
                document.getElementById("verifiedText").style.opacity = 1;
                noiseBurst(0.2, 0.05);
                tone(220, 0.15, "sawtooth", 0.06);
                triggerWelcomeSpeech("UNKNOWN", result.gender, resized.length);
              }
            } else {
              if (elapsed % 600 < 50) scanSound();
            }
          }

          targetLockedTime = Date.now();
          drawCyberBox(ctx, result.detection.box, label, "99%", "Neutral", 26, "male", canvas.width);
          drawLandmarks(ctx, result.landmarks, canvas.width);
        }
      } catch (e) {
        console.warn("Detection error:", e);
      }

      requestAnimationFrame(detectLoop);
    }

    async function initializeSystem() {
      try {
        createAudio();
        if (audioContext && audioContext.state === "suspended") {
          await audioContext.resume();
        }

        overlay.classList.add("hidden");
        scanCard.classList.add("active");

        await loadModels();
        await startWebcam();
        
        statusText.textContent = `SEARCHING FOR SUBJECT...`;
        detectLoop();
      } catch (err) {
        console.warn("System load failed, falling back to mock scanner:", err);
        overlay.classList.add("hidden");
        scanCard.classList.add("active");

        const progressEl = document.querySelector('.progress');
        progressEl.style.animation = '';
        progressEl.style.width = '';

        bootSound();
        startStatusCycle();
        setTimeout(() => {
          startScanLoop();
        }, 500);
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const isEmbedded = urlParams.get('embed') === 'true' || urlParams.get('autoplay') === 'true';

    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
    }

    if (isEmbedded) {
      setTimeout(() => {
        initializeSystem();
      }, 800);
    } else {
      overlay.addEventListener("click", () => {
        initializeSystem();
      });
    }
  </script>
