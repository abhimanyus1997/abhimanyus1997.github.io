<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>BIOMETRIC AUTHENTICATION</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        :root {
            --ink: #171915;
            --paper: #f2f0e9;
            --acid: #c9ff36;
            --muted: #73766c;
            --mono: 'DM Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--ink);
            color: var(--paper);
            font-family: Manrope, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Noise Overlay */
        .noise {
            position: fixed;
            inset: 0;
            opacity: 0.04;
            pointer-events: none;
            z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* Cinematic Background */
        .cinematic-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(201, 255, 54, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(201, 255, 54, 0.05) 0%, transparent 50%),
                var(--ink);
        }

        /* Grid Overlay */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(201, 255, 54, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201, 255, 54, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridPulse 5s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        /* Main Container */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6vw;
        }

        /* Header - Intelligence in Motion Style */
        .auth-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-eyebrow {
            font: 10px var(--mono);
            letter-spacing: 0.18em;
            color: var(--acid);
            margin-bottom: 20px;
        }

        .auth-title {
            font: 600 clamp(32px, 8vw, 72px) / 0.88 Manrope, sans-serif;
            letter-spacing: -0.06em;
            color: var(--paper);
            margin-bottom: 12px;
        }

        .auth-subtitle {
            font: 9px var(--mono);
            letter-spacing: 0.12em;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-subtitle i {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--acid);
            box-shadow: 0 0 18px var(--acid);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Scanner Frame */
        .scanner-frame {
            position: relative;
            width: min(320px, 80vw);
            aspect-ratio: 3/4;
            background: rgba(23, 25, 21, 0.8);
            border: 1px solid rgba(201, 255, 54, 0.2);
            overflow: hidden;
            box-shadow: 0 0 60px rgba(201, 255, 54, 0.1);
        }

        /* Corner Brackets */
        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: var(--acid);
            border-style: solid;
            z-index: 15;
        }

        .corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
        .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
        .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
        .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

        video, canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        video {
            filter: brightness(0.75) contrast(1.15);
        }

        canvas {
            z-index: 5;
        }

        /* Scan Sweep */
        .scan-sweep {
            position: absolute;
            left: 0;
            right: 0;
            height: 80px;
            top: -100px;
            z-index: 6;
            pointer-events: none;
            background: linear-gradient(to bottom,
                transparent,
                rgba(201, 255, 54, 0.25),
                transparent
            );
            animation: sweepMove 2.5s linear infinite;
        }

        @keyframes sweepMove {
            from { top: -100px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            to { top: 100%; opacity: 0; }
        }

        /* Face Guide */
        .face-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 180px;
            border: 2px dashed rgba(201, 255, 54, 0.3);
            border-radius: 50%;
            z-index: 4;
            pointer-events: none;
            animation: guidePulse 2s ease-in-out infinite;
        }

        @keyframes guidePulse {
            0%, 100% { border-color: rgba(201, 255, 54, 0.3); }
            50% { border-color: rgba(201, 255, 54, 0.6); }
        }

        .face-guide::after {
            content: "ALIGN FACE";
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font: 9px var(--mono);
            letter-spacing: 0.15em;
            color: var(--acid);
            white-space: nowrap;
        }

        /* Status Panel */
        .status-panel {
            margin-top: 30px;
            padding: 18px 24px;
            background: rgba(23, 25, 21, 0.6);
            border: 1px solid rgba(201, 255, 54, 0.15);
            min-width: 280px;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font: 10px var(--mono);
            letter-spacing: 0.08em;
            border-bottom: 1px solid rgba(201, 255, 54, 0.08);
        }

        .status-line:last-child {
            border-bottom: none;
        }

        .status-label {
            color: var(--muted);
        }

        .status-value {
            color: var(--acid);
        }

        .status-value.success {
            color: var(--acid);
            text-shadow: 0 0 10px var(--acid);
            animation: successFlash 0.5s ease 3;
        }

        @keyframes successFlash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Audio Dialog */
        .audio-dialog {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .audio-waves {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 24px;
        }

        .audio-wave {
            width: 2px;
            background: var(--acid);
            border-radius: 1px;
            animation: waveAnim 1s ease-in-out infinite;
        }

        .audio-wave:nth-child(1) { animation-delay: 0s; height: 8px; }
        .audio-wave:nth-child(2) { animation-delay: 0.1s; height: 16px; }
        .audio-wave:nth-child(3) { animation-delay: 0.2s; height: 24px; }
        .audio-wave:nth-child(4) { animation-delay: 0.3s; height: 16px; }
        .audio-wave:nth-child(5) { animation-delay: 0.4s; height: 8px; }

        .audio-wave.inactive {
            animation: none;
            height: 8px;
            opacity: 0.3;
        }

        @keyframes waveAnim {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }

        .audio-text {
            font: 10px var(--mono);
            letter-spacing: 0.15em;
            color: var(--acid);
        }

        /* Voice Panel */
        .voice-panel {
            position: fixed;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 16px 24px;
            background: rgba(23, 25, 21, 0.95);
            border: 1px solid rgba(201, 255, 54, 0.2);
            min-width: 280px;
        }

        .voice-panel.active {
            display: flex;
        }

        .voice-title {
            font: 10px var(--mono);
            letter-spacing: 0.18em;
            color: var(--acid);
        }

        .voice-transcript {
            font-size: 14px;
            color: var(--paper);
            min-height: 20px;
            text-align: center;
        }

        .voice-commands {
            font: 9px var(--mono);
            letter-spacing: 0.08em;
            color: var(--muted);
            text-align: center;
            margin-top: 10px;
        }

        /* Start Button */
        .start-btn {
            margin-top: 30px;
            padding: 14px 36px;
            background: var(--acid);
            border: none;
            color: var(--ink);
            font: 12px var(--mono);
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease 0.5s both;
        }

        .start-btn:hover {
            box-shadow: 0 0 30px rgba(201, 255, 54, 0.4);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        .start-btn.hidden {
            display: none;
        }

        /* Skip Button */
        .skip-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 30;
            padding: 10px 18px;
            background: transparent;
            border: 1px solid rgba(201, 255, 54, 0.2);
            color: var(--muted);
            font: 10px var(--mono);
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .skip-btn:hover {
            border-color: var(--acid);
            color: var(--acid);
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: grid;
            place-items: center;
            background: var(--ink);
            transition: 0.4s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-box {
            width: min(300px, 85vw);
            padding: 24px;
            border: 1px solid rgba(201, 255, 54, 0.2);
            background: rgba(23, 25, 21, 0.9);
            text-align: center;
        }

        .loading-title {
            font: 11px var(--mono);
            letter-spacing: 0.18em;
            color: var(--acid);
            margin-bottom: 20px;
        }

        .loading-bar {
            height: 3px;
            background: rgba(201, 255, 54, 0.15);
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            width: 0%;
            background: var(--acid);
            transition: width 0.3s ease;
        }

        .loading-text {
            margin-top: 14px;
            font: 9px var(--mono);
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        /* Success Screen */
        .success-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            background: var(--ink);
            opacity: 0;
            visibility: hidden;
            transition: 0.5s ease;
        }

        .success-screen.active {
            opacity: 1;
            visibility: visible;
        }

        .success-content {
            text-align: center;
            animation: successZoom 0.6s ease;
        }

        @keyframes successZoom {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-icon {
            width: 70px;
            height: 70px;
            border: 2px solid var(--acid);
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 30px rgba(201, 255, 54, 0.3);
        }

        .success-icon svg {
            width: 32px;
            height: 32px;
            stroke: var(--acid);
            stroke-width: 2.5;
            fill: none;
        }

        .success-title {
            font: 600 clamp(24px, 5vw, 36px) / 1 Manrope, sans-serif;
            letter-spacing: -0.04em;
            color: var(--paper);
            margin-bottom: 8px;
        }

        .success-sub {
            font: 10px var(--mono);
            letter-spacing: 0.12em;
            color: var(--acid);
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: none;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-buttons.active {
            display: flex;
        }

        .nav-btn {
            padding: 12px 22px;
            background: transparent;
            border: 1px solid rgba(201, 255, 54, 0.3);
            color: var(--paper);
            font: 10px var(--mono);
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--acid);
            color: var(--ink);
            border-color: var(--acid);
        }

        /* Error Message */
        .error-msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            padding: 12px 20px;
            background: rgba(154, 90, 73, 0.2);
            border: 1px solid #9a5a49;
            color: #d4a29a;
            font: 10px var(--mono);
            letter-spacing: 0.08em;
            text-align: center;
            display: none;
        }

        .error-msg.show {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%); }
            20%, 60% { transform: translateX(calc(-50% - 5px)); }
            40%, 80% { transform: translateX(calc(-50% + 5px)); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-container {
                padding: 8vw 5vw;
            }

            .scanner-frame {
                width: 75vw;
            }

            .status-panel {
                min-width: 85vw;
                padding: 14px 18px;
            }

            .voice-panel {
                min-width: 85vw;
                bottom: 120px;
            }

            .audio-dialog {
                bottom: 60px;
            }

            .nav-btn {
                padding: 10px 18px;
            }
        }
    </style>
</head>

<body>
    <div class="noise"></div>
    <div class="cinematic-bg"></div>
    <div class="grid-overlay"></div>

    <button class="skip-btn" id="skipBtn">SKIP →</button>

    <div class="auth-container">
        <header class="auth-header">
            <p class="auth-eyebrow">AS / BIOMETRIC AUTH</p>
            <h1 class="auth-title">INTELLIGENCE<br>IN MOTION</h1>
            <span class="auth-subtitle"><i></i> NEURAL CORRELATION ENGINE</span>
        </header>

        <div class="scanner-frame">
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>

            <div class="face-guide"></div>
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
            <div class="scan-sweep"></div>
        </div>

        <div class="status-panel">
            <div class="status-line">
                <span class="status-label">STATUS</span>
                <span class="status-value" id="statusText">AWAITING INIT</span>
            </div>
            <div class="status-line">
                <span class="status-label">IDENTITY</span>
                <span class="status-value" id="identityText">---</span>
            </div>
            <div class="status-line">
                <span class="status-label">CONFIDENCE</span>
                <span class="status-value" id="confidenceText">---</span>
            </div>
        </div>

        <button class="start-btn" id="startBtn">INITIALIZE SCAN</button>

        <div class="nav-buttons" id="navButtons">
            <button class="nav-btn" data-nav="projects">PROJECTS</button>
            <button class="nav-btn" data-nav="about">ABOUT</button>
            <button class="nav-btn" data-nav="contact">CONTACT</button>
            <button class="nav-btn" data-nav="home">HOME</button>
        </div>

        <div class="audio-dialog" id="audioDialog">
            <div class="audio-waves" id="audioWaves">
                <div class="audio-wave"></div>
                <div class="audio-wave"></div>
                <div class="audio-wave"></div>
                <div class="audio-wave"></div>
                <div class="audio-wave"></div>
            </div>
            <div class="audio-text" id="audioText">PROCESSING...</div>
        </div>

        <div class="voice-panel" id="voicePanel">
            <div class="voice-title">VOICE COMMAND</div>
            <div class="voice-transcript" id="voiceTranscript">Listening...</div>
            <div class="voice-commands">Say: "projects", "about", "contact", or "home"</div>
        </div>
    </div>

    <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="loading-box">
            <div class="loading-title">SYSTEM INIT</div>
            <div class="loading-bar">
                <div class="loading-progress" id="loadingProgress"></div>
            </div>
            <div class="loading-text" id="loadingText">LOADING...</div>
        </div>
    </div>

    <div class="success-screen" id="successScreen">
        <div class="success-content">
            <div class="success-icon">
                <svg viewBox="0 0 24 24">
                    <polyline points="4,12 9,17 20,6"></polyline>
                </svg>
            </div>
            <div class="success-title" id="successTitle">ACCESS GRANTED</div>
            <div class="success-sub" id="successSub">IDENTITY VERIFIED</div>
        </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("overlay");
        const ctx = canvas.getContext("2d");
        const startBtn = document.getElementById("startBtn");
        const skipBtn = document.getElementById("skipBtn");
        const loadingOverlay = document.getElementById("loadingOverlay");
        const loadingProgress = document.getElementById("loadingProgress");
        const loadingText = document.getElementById("loadingText");
        const statusText = document.getElementById("statusText");
        const identityText = document.getElementById("identityText");
        const confidenceText = document.getElementById("confidenceText");
        const audioDialog = document.getElementById("audioDialog");
        const audioWaves = document.getElementById("audioWaves");
        const audioText = document.getElementById("audioText");
        const voicePanel = document.getElementById("voicePanel");
        const voiceTranscript = document.getElementById("voiceTranscript");
        const successScreen = document.getElementById("successScreen");
        const successTitle = document.getElementById("successTitle");
        const successSub = document.getElementById("successSub");
        const errorMsg = document.getElementById("errorMsg");
        const navButtons = document.getElementById("navButtons");

        const MODEL_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";
        const REFERENCE_IMAGE = "/abhimanyu-reference.jpg";
        const MATCH_THRESHOLD = 0.55;
        const AUDIO_BASE = "/static/audio/";

        const AUDIO_FILES = {
            abhimanyu: ["welcome-abhimanyu-1.wav", "welcome-abhimanyu-2.wav", "welcome-abhimanyu-3.wav", "welcome-abhimanyu-4.wav"],
            unknown_male: ["welcome-unknown-male-1.wav", "welcome-unknown-male-2.wav", "welcome-unknown-male-3.wav", "welcome-unknown-male-4.wav"],
            unknown_female: ["welcome-unknown-female-1.wav", "welcome-unknown-female-2.wav", "welcome-unknown-female-3.wav", "welcome-unknown-female-4.wav"],
            group: ["welcome-group-1.wav", "welcome-group-2.wav", "welcome-group-3.wav"],
            prompt: "welcome-prompt-query.wav"
        };

        let faceMatcher = null;
        let audioCtx = null;
        let isScanning = false;
        let authenticated = false;
        let recognition = null;
        let authTriggered = false;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, duration, type = "sine", gain = 0.1) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            g.gain.setValueAtTime(0.001, now);
            g.gain.exponentialRampToValueAtTime(gain, now + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, now + duration);
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + duration + 0.1);
        }

        function playWav(file) {
            return new Promise((resolve) => {
                const audio = new Audio(AUDIO_BASE + file);
                audio.play().catch(console.warn);
                audio.onended = resolve;
                audio.onerror = resolve;
                audioDialog.style.display = "flex";
                audioWaves.querySelectorAll(".audio-wave").forEach(w => w.classList.remove("inactive"));
                setTimeout(() => audioWaves.querySelectorAll(".audio-wave").forEach(w => w.classList.add("inactive")), 500);
            });
        }

        function playSuccessSound() {
            playTone(523, 0.15, "sine", 0.1);
            setTimeout(() => playTone(659, 0.15, "sine", 0.1), 150);
            setTimeout(() => playTone(784, 0.25, "sine", 0.12), 300);
        }

        async function speakWelcome(identity, gender, count) {
            let audioKey = "unknown_male";
            if (identity === "ABHIMANYU") audioKey = "abhimanyu";
            else if (count > 1) audioKey = "group";
            else if (gender === "female") audioKey = "unknown_female";

            const files = AUDIO_FILES[audioKey];
            const randomFile = files[Math.floor(Math.random() * files.length)];
            audioText.textContent = identity === "ABHIMANYU" ? "WELCOME BACK" : "WELCOME VISITOR";
            await playWav(randomFile);
            audioText.textContent = "AWAITING COMMAND";
            await playWav(AUDIO_FILES.prompt);
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { console.warn("Speech Recognition not supported"); return null; }

            const rec = new SpeechRecognition();
            rec.continuous = false;
            rec.interimResults = true;
            rec.lang = "en-US";

            rec.onstart = () => { voicePanel.classList.add("active"); voiceTranscript.textContent = "Listening..."; };
            rec.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                voiceTranscript.textContent = transcript;
                if (event.results[0].isFinal) handleVoiceCommand(transcript);
            };
            rec.onerror = () => { voiceTranscript.textContent = "Not recognized. Try again."; };
            rec.onend = () => { if (!authenticated) setTimeout(() => { if (voicePanel.classList.contains("active")) rec.start(); }, 1000); };

            return rec;
        }

        function handleVoiceCommand(transcript) {
            const commands = { "projects": "/#projects", "project": "/#projects", "about": "/#about", "about me": "/#about", "contact": "/#contact", "email": "/#contact", "home": "/", "main": "/", "skip": "/", "enter": "/" };
            for (const [cmd, path] of Object.entries(commands)) {
                if (transcript.includes(cmd)) { navigateTo(path, cmd.toUpperCase()); return; }
            }
            voiceTranscript.textContent = `Unknown: "${transcript}". Say: projects, about, contact, home`;
        }

        function navigateTo(path, label) {
            authenticated = true;
            voicePanel.classList.remove("active");
            voiceTranscript.textContent = `NAVIGATING TO ${label}...`;
            playSuccessSound();
            setTimeout(() => { sessionStorage.setItem("auth_done", "true"); window.location.href = path; }, 800);
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add("show");
            setTimeout(() => errorMsg.classList.remove("show"), 3000);
        }

        function updateProgress(percent, text) {
            loadingProgress.style.width = `${percent}%`;
            loadingText.textContent = text;
        }

        async function loadModels() {
            updateProgress(0, "LOADING NEURAL MODELS...");
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            updateProgress(25, "FACE DETECTOR READY");
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            updateProgress(50, "LANDMARKS READY");
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            updateProgress(75, "RECOGNITION READY");
            await faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL);
            updateProgress(100, "SYSTEM READY");
        }

        async function createFaceMatcher() {
            try {
                const img = await faceapi.fetchImage(REFERENCE_IMAGE);
                const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                if (detection) {
                    const labeled = new faceapi.LabeledFaceDescriptors("ABHIMANYU", [detection.descriptor]);
                    faceMatcher = new faceapi.FaceMatcher(labeled, MATCH_THRESHOLD);
                    return true;
                }
            } catch (e) { console.warn("Reference not found:", e); }
            return false;
        }

        async function requestPermissions() {
            // Request both camera and microphone upfront for iOS/Safari/Android
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: true // Request microphone for STT
                });
                // Stop the stream for now, we'll request again later
                stream.getTracks().forEach(track => track.stop());
                return true;
            } catch (e) {
                console.error("Permission denied:", e);
                return false;
            }
        }

        async function startWebcam() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                audio: true // Include audio for iOS/Safari
            });
            video.srcObject = stream;
            await new Promise(r => video.onloadedmetadata = r);

            // iOS Safari requires explicit play() in user gesture
            try {
                await video.play();
            } catch (e) {
                console.warn("Autoplay blocked, waiting for interaction");
            }
        }

        function resizeCanvas() {
            const rect = video.getBoundingClientRect();
            canvas.width = rect.width * devicePixelRatio;
            canvas.height = rect.height * devicePixelRatio;
            ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        }

        function drawDetection(box, label) {
            const w = canvas.clientWidth;
            const x = w - box.x - box.width;
            const y = box.y;
            const bw = box.width;
            const bh = box.height;
            const isMatch = label === "ABHIMANYU";
            const color = isMatch ? "#c9ff36" : "#ffcc33";

            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.shadowColor = color;
            ctx.shadowBlur = 12;
            ctx.strokeRect(x, y, bw, bh);

            ctx.fillStyle = "rgba(23,25,21,0.85)";
            ctx.fillRect(x, y - 22, bw, 22);
            ctx.fillStyle = color;
            ctx.font = "10px 'DM Mono', monospace";
            ctx.fillText(isMatch ? "IDENTIFIED" : "SCANNING...", x + 8, y - 7);
            ctx.restore();
        }

        async function detectLoop() {
            if (!isScanning || authenticated) return;
            resizeCanvas();

            const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withAgeAndGender().withFaceDescriptors();
            ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

            if (detections.length === 0) {
                statusText.textContent = "NO FACE DETECTED";
                identityText.textContent = "---";
                confidenceText.textContent = "---";
            } else {
                const detection = detections[0];
                const box = detection.detection.box;
                let label = "UNKNOWN";
                let distance = "---";

                if (faceMatcher) {
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    label = match.label;
                    distance = match.distance.toFixed(2);
                }

                drawDetection(box, label);
                const confidence = Math.round(detection.detection.score * 100);
                statusText.textContent = "SCANNING...";
                identityText.textContent = label;
                confidenceText.textContent = `${confidence}% | DIST: ${distance}`;

                if (label === "ABHIMANYU" && parseFloat(distance) < MATCH_THRESHOLD) {
                    await handleAuthentication(label, detection.gender, detections.length);
                } else if (label === "unknown" && confidence > 70) {
                    await handleAuthentication(label, detection.gender, detections.length);
                }
            }

            requestAnimationFrame(detectLoop);
        }

        async function handleAuthentication(identity, gender, count) {
            if (authTriggered) return;
            authTriggered = true;
            isScanning = false;

            statusText.textContent = "VERIFIED";
            statusText.classList.add("success");
            identityText.classList.add("success");
            confidenceText.classList.add("success");

            playSuccessSound();
            successTitle.textContent = identity === "ABHIMANYU" ? "WELCOME BACK" : "WELCOME VISITOR";
            successSub.textContent = identity === "ABHIMANYU" ? "ABHIMANYU VERIFIED" : `${gender.toUpperCase()} DETECTED`;
            successScreen.classList.add("active");

            await speakWelcome(identity, gender, count);
            voicePanel.classList.add("active");
            navButtons.classList.add("active");
            audioDialog.style.display = "none";

            if (recognition) recognition.start();
        }

        navButtons.querySelectorAll(".nav-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const nav = btn.dataset.nav;
                const path = nav === "home" ? "/" : `/#${nav}`;
                navigateTo(path, nav.toUpperCase());
            });
        });

        startBtn.addEventListener("click", async () => {
            try {
                startBtn.classList.add("hidden");
                loadingOverlay.classList.remove("hidden");
                statusText.textContent = "REQUESTING PERMISSIONS...";
                initAudio();

                // Request camera + mic permissions upfront (iOS/Safari/Android)
                updateProgress(5, "REQUESTING CAMERA & MICROPHONE...");
                const hasPermissions = await requestPermissions();

                if (!hasPermissions) {
                    throw new Error("Permissions denied");
                }

                updateProgress(10, "PERMISSIONS GRANTED");

                await loadModels();
                await createFaceMatcher();
                await startWebcam();

                loadingOverlay.classList.add("hidden");
                statusText.textContent = "READY";
                audioDialog.style.display = "flex";
                audioText.textContent = "ALIGN YOUR FACE";
                playTone(600, 0.1, "sine", 0.08);

                recognition = initSpeechRecognition();
                isScanning = true;
                detectLoop();
            } catch (e) {
                console.error(e);
                loadingOverlay.classList.add("hidden");
                startBtn.classList.remove("hidden");
                showError("CAMERA & MIC ACCESS REQUIRED. Allow permissions in browser settings.");
            }
        });

        skipBtn.addEventListener("click", () => {
            playTone(600, 0.1, "sine", 0.08);
            sessionStorage.setItem("auth_done", "true");
            window.location.href = "/";
        });

        window.addEventListener("resize", resizeCanvas);
    </script>
</body>

</html>
